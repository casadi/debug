name: issue 4417 - Ipopt/MUMPS wall time 3.8.0 vs 3.8.1 vs nightly-main (OpenBLAS 0.3.24.mod)

on: [push, workflow_dispatch]

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, ubuntu-24.04]
        casadi: ["3.8.0", "3.8.1", "nightly-main"]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          if [ "${{ matrix.casadi }}" = nightly-main ]; then
            case "${{ runner.os }}" in Windows) plat=win_amd64;; *) plat=manylinux2014_x86_64;; esac
            python -m pip install -q numpy "https://github.com/casadi/casadi/releases/download/nightly-main/casadi-3.8.1.dev+main-cp311-abi3-$plat.whl"
          else
            python -m pip install -q numpy "casadi==${{ matrix.casadi }}"
          fi
          python -c "import casadi; print(casadi.__version__)"
      - name: default threads
        shell: bash
        run: python issue4417/bench.py 600 5 | grep RESULT
      - name: OPENBLAS_NUM_THREADS=1
        shell: bash
        env: { OPENBLAS_NUM_THREADS: "1" }
        run: python issue4417/bench.py 600 5 | grep RESULT
      - name: OPENBLAS_NUM_THREADS=2
        shell: bash
        env: { OPENBLAS_NUM_THREADS: "2" }
        run: python issue4417/bench.py 600 5 | grep RESULT
      - name: default threads, n=1200
        shell: bash
        run: python issue4417/bench.py 1200 2 | grep RESULT
      - name: OPENBLAS_NUM_THREADS=1, n=1200
        shell: bash
        env: { OPENBLAS_NUM_THREADS: "1" }
        run: python issue4417/bench.py 1200 2 | grep RESULT
