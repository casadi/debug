name: open issues - replicate mac/windows reports against nightly-main

on: [push, workflow_dispatch]

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macos-14
            plat: macosx_11_0_arm64
            issues: "4146,4141,3862,3409,2622,1288,4144,3876,3456,2755,2989"
          - image: macos-15-intel
            plat: macosx_11_0_x86_64.macosx_11_0_intel
            issues: "4146,4141,3862,3409,2622,1288,4437"
          - image: windows-2022
            plat: win_amd64
            issues: "4437,2989,3876,3696,3456,4144,2755,4141,4146"
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python -m pip install -q numpy jupyter_client ipykernel "https://github.com/casadi/casadi/releases/download/nightly-main/casadi-3.8.1.dev+main-cp311-abi3-${{ matrix.plat }}.whl"
          python -c "import casadi; print(casadi.__version__)"
      - shell: bash
        run: python open_issue_repros/run_all.py "${{ matrix.issues }}"
