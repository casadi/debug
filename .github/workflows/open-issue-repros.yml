name: open issues - replicate mac/windows reports against nightly-main

on: [push, workflow_dispatch]

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: windows-2022
            plat: win_amd64
            issues: "4437"
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python -m pip install -q numpy jupyter_client ipykernel "https://github.com/casadi/casadi/releases/download/nightly-main/casadi-3.8.1.dev+main-cp311-abi3-${{ matrix.plat }}.whl"
          python -c "import casadi; print(casadi.__version__)"
      - shell: bash
        run: python open_issue_repros/run_all.py "${{ matrix.issues }}"
