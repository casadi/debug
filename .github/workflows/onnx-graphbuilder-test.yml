name: ONNX graph_builder test against wheel

on:
  push:
  workflow_dispatch:

# Validate the fixed test/python/graph_builder.py (pip onnxruntime preload + have_real_ort gate)
# against the shipped lacemodelica2 wheel, without a casadi rebuild. Overlays this repo's
# graph_builder.py onto the casadi test harness (helpers.py etc).
jobs:
  gb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get casadi test harness (lacemodelica2)
        run: |
          git clone --depth 1 --branch lacemodelica2 https://github.com/casadi/casadi.git cas
          cp graph_builder.py cas/test/python/graph_builder.py
      - name: Install wheel + deps
        run: |
          pip install numpy onnx onnxruntime
          pip install "https://github.com/casadi/casadi/releases/download/nightly-lacemodelica2/casadi-3.7.2.dev+lacemodelica2-cp311-abi3-manylinux_2_28_x86_64.whl"
      - name: Run graph_builder.py (numeric + symbolic)
        run: |
          cd cas/test/python
          python graph_builder.py 2>&1 | tail -40
