name: Issue 3605 Windows Opti memory
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        casadi: ['3.6.5', '3.7.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-gdb
      - name: Build debugger marker and locate GDB
        shell: msys2 {0}
        run: |
          gcc -shared -O0 -g issue3605/marker.c -o issue3605/marker.dll
          echo "PROBE_GDB=$(cygpath -m /mingw64/bin/gdb.exe)" >> "$GITHUB_ENV"
      - name: Install pinned CasADi and record environment
        shell: pwsh
        run: |
          python -m pip install "casadi==${{ matrix.casadi }}" "numpy<2" psutil
          python -m pip freeze
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, TotalVisibleMemorySize
          Get-CimInstance Win32_PageFileUsage | Format-List *
      - name: Validate console-interrupt pilot
        shell: pwsh
        run: python issue3605/probe.py run --gdb "$env:PROBE_GDB" --count 3 --timeout 60 --output pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue3605-pilot-${{ matrix.casadi }}
          path: pilot/
          if-no-files-found: warn
      - name: Run monitored loops
        shell: pwsh
        run: python issue3605/probe.py run --gdb "$env:PROBE_GDB" --count 1000 --output results
      - name: Final pagefile state
        if: always()
        shell: pwsh
        run: Get-CimInstance Win32_PageFileUsage | Format-List *
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue3605-windows-${{ matrix.casadi }}
          path: |
            pilot/
            results/
          if-no-files-found: error
