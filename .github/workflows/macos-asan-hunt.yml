name: macos ASan full-suite hunt (interpolant heap corruption)

# Self-contained macOS ASan build of casadi + full test suite, to catch the
# heap corruption whose SIGSEGV surfaces (variably) in e.g.
# test_2d_linear_multiout -> Sparsity::assign_cached. casadi/casadi CI is too
# slow to iterate on; this builds once (cached) and runs the suite under ASan.
#
# Only casadi's OWN code (libcasadi + plugins + _casadi) is ASan-instrumented:
# ExternalProjects (ipopt/mumps/sundials/...) are separate cmake builds that do
# NOT inherit CMAKE_CXX_FLAGS, so they build normally (build time ~ a normal mac
# build) and run uninstrumented under the ASan runtime. WITH_DEEPBIND=OFF because
# ASan cannot dlopen RTLD_DEEPBIND plugins. No code signing needed (debug only).

on: [workflow_dispatch]

env:
  CASADI_REF: release-3.8.0
  PYV: "3.12"
  build_flags: "-DWITH_COMMON=OFF -DWITH_BUILD_REQUIRED=ON -DWITH_BUILD_BONMIN=ON -DWITH_BONMIN=ON -DWITH_IPOPT=ON -DWITH_BUILD_IPOPT=ON -DWITH_BUILD_LAPACK=ON -DWITH_LAPACK=ON -DWITH_MUMPS=ON -DWITH_CLP=ON -DWITH_BUILD_CLP=ON -DWITH_CBC=ON -DWITH_BUILD_CBC=ON -DWITH_THREAD=ON -DWITH_QPOASES=ON -DWITH_HPIPM=ON -DWITH_BLASFEO=ON -DWITH_BUILD_HPIPM=ON -DWITH_BUILD_BLASFEO=ON -DWITH_HIGHS=ON -DWITH_BUILD_HIGHS=ON -DWITH_PROXQP=ON -DWITH_OSQP=ON -DWITH_SUPERSCS=ON -DWITH_KNITRO=ON -DWITH_MOCKUP_KNITRO=ON -DWITH_CPLEX=ON -DWITH_MOCKUP_CPLEX=ON -DWITH_GUROBI=ON -DWITH_MOCKUP_GUROBI=ON -DWITH_XPRESS=ON -DWITH_MOCKUP_XPRESS=ON -DWITH_MOSEK=ON -DWITH_MOCKUP_MOSEK=ON -DWITH_HSL=ON -DWITH_MOCKUP_HSL=ON -DWITH_SUNDIALS=ON -DWITH_BUILD_SUNDIALS=ON -DWITH_BUILD_CSPARSE=ON -DWITH_BUILD_METIS=ON -DWITH_BUILD_SUPERSCS=ON -DWITH_BUILD_OSQP=ON -DWITH_BUILD_EIGEN3=ON -DWITH_BUILD_SIMDE=ON -DWITH_BUILD_PROXQP=ON -DWITH_SNOPT=ON -DWITH_MOCKUP_SNOPT=ON -DWITH_AMPL=ON -DWITH_BLOCKSQP=ON -DWITH_SLEQP=ON -DWITH_SLEQP_BUILD=ON -DWITH_DAQP=ON -DWITH_BUILD_DAQP=ON -DWITH_FATROP=ON -DWITH_BUILD_FATROP=ON -DWITH_MADNLP=ON -DWITH_MOCKUP_MADNLP=ON -DWITH_CCOPT=ON -DWITH_MOCKUP_CCOPT=ON -DWITH_PYTHON_GIL_RELEASE=ON -DWITH_THREADSAFE_SYMBOLICS=ON -DWITH_LIBZIP=ON -DWITH_BUILD_LIBZIP=ON -DWITH_ZLIB=ON -DWITH_BUILD_ZLIB=ON -DWITH_GHC_FILESYSTEM=ON -DWITH_BUILD_GHC_FILESYSTEM=ON -DWITH_PIQP=ON -DWITH_BUILD_PIQP=ON -DWITH_UNO=ON -DWITH_BUILD_UNO=ON -DWITH_PROTOBUF=ON -DWITH_BUILD_PROTOBUF=ON -DWITH_ONNX=ON -DWITH_BUILD_ONNX=ON -DWITH_LACEMODELICA=ON -DWITH_BUILD_LACEMODELICA=ON -DWITH_ONNX_RUNTIME=ON -DWITH_MOCKUP_ONNX_RUNTIME=ON -DWITH_SPRAL=OFF -DWITH_BUILD_SPRAL=OFF -DWITH_WORHP=OFF -DWITH_MOCKUP_WORHP=OFF -DWITH_ALPAQA=OFF -DWITH_BUILD_ALPAQA=OFF -DWITH_CLARABEL=OFF -DWITH_BUILD_CLARABEL=OFF -DWITH_RUMOCA=OFF -DWITH_BUILD_LAPACK=OFF"

jobs:
  asan:
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      # Curated toolchain CI uses to build all macOS externals cleanly
      # (handles -noall_load / gfortran / cctools). Exports CC/CXX/FC/SDKROOT.
      - uses: casadi/action-setup-compiler@master
        with:
          cache-suffix: ''
          target: arm64

      - name: Locate ASan runtime from the curated clang
        run: |
          set -eux
          "$CC" --version
          CLANGROOT=$(dirname "$(dirname "$CC")")
          ASAN_DYLIB=$(find "$CLANGROOT" -name 'libclang_rt.asan_osx_dynamic.dylib' 2>/dev/null | head -1)
          test -n "$ASAN_DYLIB"
          echo "ASAN_DYLIB=$ASAN_DYLIB" >> $GITHUB_ENV
          ls -l "$ASAN_DYLIB"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: test
          auto-update-conda: true

      - name: Python deps
        shell: bash -el {0}
        run: pip install numpy scipy pandas looseversion pyright onnx onnxruntime || pip install numpy scipy pandas looseversion

      - name: Fetch casadi source zip (SWIG wrappers baked in -> SWIG_IMPORT)
        run: |
          set -eux
          curl -fsSL -o /tmp/cs.zip \
            "https://github.com/casadi/casadi/releases/download/nightly-release-3.8.0/casadi-source-v3.8.0.zip"
          mkdir -p src && unzip -q /tmp/cs.zip -d src
          test -f src/swig/python/target3/source/casadiPYTHON_wrap.cxx

      - name: mockups (Path-1, for proprietary find_package + madnlp/onnx mockups)
        uses: casadi/mockups@master
        with:
          tag: macos-14_arm64

      - name: Cache ASan build
        uses: actions/cache@v4
        with:
          key: macos-asan-build-v1-${{ env.CASADI_REF }}
          path: src/build

      - name: Configure + build (ASan on casadi code only)
        shell: bash -el {0}
        run: |
          set -eux
          cd src
          rm -f build/CMakeCache.txt
          ASANFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1"
          PYEXE=$(python -c 'import sys;print(sys.executable)')
          CC="$CC" CXX="$CXX" FC="$FC" cmake -Bbuild -H. \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_SELFCONTAINED=ON \
            -DWITH_DEEPBIND=OFF \
            -DSWIG_IMPORT=ON \
            -DWITH_PYTHON=ON -DWITH_PYTHON3=ON -DPython3_EXECUTABLE="$PYEXE" \
            -DCMAKE_C_FLAGS="$ASANFLAGS" -DCMAKE_CXX_FLAGS="$ASANFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_INSTALL_PREFIX="$PWD/../inst" \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/mockups/cmake" \
            $build_flags
          CC="$CC" CXX="$CXX" FC="$FC" cmake --build build -j3
          cmake --build build --target install
          cmake --build build --target install_python || true
          find ../inst -name "_casadi*.so" -o -name "__init__.py" -path "*casadi*" | head

      - name: Runtime libMad (apple-aarch64) so madnlp/Julia loads (shadow mockup)
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/libMad"
          curl -fL -o "$RUNNER_TEMP/libMad/libMad.tar.gz" \
            "https://github.com/apozharski/libMad/releases/download/v0.0.7-casadi/libMad-apple-aarch64-v0.0.7-casadi.tar.gz" || true
          tar -xf "$RUNNER_TEMP/libMad/libMad.tar.gz" -C "$RUNNER_TEMP/libMad" || true
          sudo cp -R "$RUNNER_TEMP/libMad/lib/" /usr/local/lib/ 2>/dev/null || true
          [ -d "$RUNNER_TEMP/libMad/share" ] && sudo cp -R "$RUNNER_TEMP/libMad/share/" /usr/local/share/ 2>/dev/null || true

      - name: Fetch test data
        shell: bash -el {0}
        run: |
          set -eux
          cd src/test/python
          curl -fL -O https://github.com/casadi/testbot/releases/download/perpetual/serialize_3.5.5.zip && unzip -o serialize_3.5.5.zip || true
          cd ../data
          for f in VanDerPol2.fmu VanDerPol3.fmu vdp.fmu cstr.fmu car_t_fmu2.fmu; do curl -fL -O "https://github.com/casadi/testbot/releases/download/perpetual/$f" || true; done

      - name: Run alltests --run_slow under ASan (halt on first error)
        shell: bash -el {0}
        run: |
          set +e
          PKG=$(cd src && python -c "import os;print(os.path.abspath('../inst'))")
          export PYTHONPATH="$PKG"
          export JULIA_CUDA_USE_COMPAT=false
          export DYLD_LIBRARY_PATH="/usr/local/lib:$PKG/casadi"
          PY=$(python -c 'import sys,os;print(os.path.realpath(sys.executable))')
          # diagnostics (NO DYLD_INSERT here, so system tools work)
          file "$PY" || true
          lipo -archs "$ASAN_DYLIB" || true
          codesign -d --verbose=2 "$PY" 2>&1 | grep -iE "flags|runtime|library-validation" || true
          # anaconda python ships hardened runtime + library validation, so macOS
          # IGNORES DYLD_INSERT_LIBRARIES of the unsigned asan dylib (asan then
          # sneaks in late via the _casadi dlopen -> dead interceptors). Strip the
          # signature to disable hardened runtime so DYLD_INSERT is honored.
          sudo codesign --remove-signature "$PY" 2>&1 | tail -2 || true
          codesign --remove-signature "$PY" 2>&1 | tail -2 || true
          # The conda clang-16 asan dylib is fat x86_64,arm64 (no arm64e). Inject
          # it ONLY into a python forced to arm64 (via arch -arm64 + env), so the
          # arm64 slice matches and system tools (arm64e) aren't broken by a
          # global DYLD_INSERT_LIBRARIES.
          ASANOPTS="detect_leaks=0:detect_container_overflow=0:detect_odr_violation=0:halt_on_error=1:abort_on_error=1:symbolize=1:print_stats=0:log_path=/tmp/asan"
          # python is plain arm64 (see `file` above) and so is the asan dylib's
          # arm64 slice -> no `arch` needed. Set DYLD_INSERT_LIBRARIES INLINE on
          # python only (NOT global, NOT via arch/env): the SIP-protected
          # /usr/bin/arch|env strip DYLD_* so asan loaded late -> interceptors
          # dead. MallocNanoZone=0 is required for asan malloc interception on macOS.
          DYLD_INSERT_LIBRARIES="$ASAN_DYLIB" ASAN_OPTIONS="$ASANOPTS" MallocNanoZone=0 "$PY" -c "import casadi; print('casadi', casadi.__version__)"
          cd src/test/python
          DYLD_INSERT_LIBRARIES="$ASAN_DYLIB" ASAN_OPTIONS="$ASANOPTS" MallocNanoZone=0 "$PY" alltests.py --run_slow 2>&1 | tee /tmp/run.log
          echo "alltests rc=${PIPESTATUS[0]}"
          echo "=== ASan reports ==="
          for f in /tmp/asan.*; do echo "### $f"; cat "$f"; done 2>/dev/null
          grep -nE "ERROR: AddressSanitizer|SUMMARY: AddressSanitizer|#[0-9]+ .*casadi" /tmp/asan.* 2>/dev/null | head -60 || true

      - name: Upload ASan + run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-logs
          path: |
            /tmp/asan.*
            /tmp/run.log
          if-no-files-found: warn
