name: lacemodelica2 conic.py segfault repro (ubuntu manylinux2014)

on: [push, workflow_dispatch]

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner baseline
        run: |
          uname -a
          cat /etc/os-release | head -3
          getconf PAGE_SIZE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download lacemodelica2 abi3 wheel + install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly-lacemodelica2 --repo casadi/casadi \
            --pattern '*cp311-abi3-manylinux2014_x86_64.whl'
          ls -la *.whl
          python -m pip install --upgrade pip
          python -m pip install numpy scipy ./*cp311-abi3-manylinux2014_x86_64.whl
          python -c "import casadi; print('casadi', casadi.CasadiMeta.version(), casadi.CasadiMeta.git_revision())" || true

      - name: Fetch test sources (lacemodelica2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch lacemodelica2 https://github.com/casadi/casadi.git src
          echo "HEAD:"; git -C src rev-parse HEAD

      - name: Sanity - conic.py is NOT the culprit (should pass)
        working-directory: src/test/python
        continue-on-error: true
        run: |
          set +e
          PYTHONFAULTHANDLER=1 python conic.py --ignore_memory_heavy > conic.txt 2>&1
          echo "::notice::conic.py exit=$? (expect 0)"
          tail -3 conic.txt

      - name: Replicate the REAL bug - graph_builder.py ONNX export leak under valgrind
        working-directory: src/test/python
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
          set +e
          valgrind --tool=memcheck --leak-check=full --show-leak-kinds=definite \
                   --error-exitcode=99 --num-callers=20 \
                   python graph_builder.py --ignore_memory_heavy > vg.txt 2>&1
          code=$?
          echo "=================== valgrind exit=$code (99 => leak detected) ==================="
          echo "----- definitely-lost summary -----"
          grep -nE "definitely lost|Memory leak:|ERROR SUMMARY" vg.txt | tail -10
          echo "----- leak stack (function_to_function_proto) -----"
          grep -nE "function_to_function_proto|export_call|Onnx::load|export_symbolic|export_onnx|definitely lost|operator new" vg.txt | tail -25
