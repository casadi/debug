# Can CASADI_PLUGIN_SEARCH_PATH (or a user DLL dir) beat C:\Windows\System32\onnxruntime.dll?
name: ORT steering on Windows

on: [push, workflow_dispatch]

env:
  ORT_DIR: ${{ github.workspace }}\onnxruntime-win-x64-1.22.0\lib

jobs:
  steer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch wheel + real ORT
        shell: bash
        run: |
          URL="https://github.com/casadi/casadi/releases/download/nightly-fix-onnxruntime-mockup-shadowing/casadi-3.8.0.dev%2Bfix.onnxruntime.mockup.shadowing-cp311-abi3-win_amd64.whl"
          WHL=$(basename "$URL" | sed 's/%2B/+/g')
          mkdir -p whl && curl -fsSL -o "whl/$WHL" "$URL"
          curl -fsSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip
          unzip -q ort.zip
          python -m pip install "whl/$WHL" onnx numpy
          python -c "import ctypes;d=ctypes.WinDLL(r'C:\Windows\System32\onnxruntime.dll');print('System32 ORT present')"

      - name: 1 control (nothing set) - expect System32 1.5.2
        shell: bash
        run: python ort/variant.py control

      - name: 2 CASADI_PLUGIN_SEARCH_PATH = ORT dir
        shell: bash
        env:
          CASADI_PLUGIN_SEARCH_PATH: ${{ github.workspace }}\onnxruntime-win-x64-1.22.0\lib
        run: python ort/variant.py control

      - name: 3 CASADI_PLUGIN_SEARCH_PATH = ORT dir + casadi package dir
        shell: bash
        run: |
          CAS=$(python -c "import casadi,os;print(os.path.dirname(casadi.__file__))")
          export CASADI_PLUGIN_SEARCH_PATH="$ORT_DIR;$CAS"
          python ort/variant.py control

      - name: 4 os.add_dll_directory(ORT dir) - is USER_DIRS above SYSTEM32?
        shell: bash
        run: python ort/variant.py adddll

      - name: 5 ctypes preload by full path (known-good reference)
        shell: bash
        run: python ort/variant.py preload
