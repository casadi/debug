name: Diagnose julia.exe sysimage bootstrap on real Windows

# A from-source (USE_BINARYBUILDER=0) cross-build of Julia 1.12.6 in the
# MXE dockcross image links libjulia.dll + libjulia-codegen.dll + julia.exe
# successfully, but the sysimage bootstrap step requires running julia.exe
# on the build host. Under wine inside the container, that exits silently
# with rc=1 and no diagnostic output. This workflow runs the same step on
# a real Windows runner so we can see what actually happens.
#
# Inputs come from the release on this repo:
#   julia-1.12.6-mxe-bootstrap / julia-winbuild-runtime.tar.gz
# (~776 MB, contains usr/, base/, stdlib/, sysimage.mk, etc. — everything
# the Windows runner needs to actually invoke julia.exe and try the
# sysimage bootstrap).

on:
  workflow_dispatch:
    inputs:
      runtime_url:
        description: 'URL of the runtime tarball (usr/ + base/ + stdlib/)'
        required: true
        default: 'https://github.com/casadi/debug/releases/download/julia-1.12.6-mxe-bootstrap/julia-winbuild-runtime.tar.gz'

jobs:
  run-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Download runtime tarball
        shell: pwsh
        run: |
          curl.exe -fsSL -o runtime.tar.gz "${{ github.event.inputs.runtime_url }}"
          Get-Item runtime.tar.gz

      - name: Extract
        shell: pwsh
        run: |
          mkdir julia-tree | Out-Null
          tar -xzf runtime.tar.gz -C julia-tree
          Get-ChildItem julia-tree
          Get-ChildItem julia-tree\usr\bin\julia.exe, julia-tree\usr\bin\libjulia*.dll

      - name: julia.exe --version with stdout/stderr capture (silent in wine — does it print on real Windows?)
        shell: cmd
        continue-on-error: true
        run: |
          set "EXE=%CD%\julia-tree\usr\bin\julia.exe"
          echo === direct invoke ===
          "%EXE%" --version
          echo === exit %ERRORLEVEL%
          echo === redirected to file ===
          "%EXE%" --version > version.out 2> version.err
          echo === out:
          type version.out
          echo === err:
          type version.err
          echo === exit %ERRORLEVEL%

      - name: julia.exe -e println(VERSION) (no sysimage needed for this)
        shell: cmd
        continue-on-error: true
        run: |
          set "EXE=%CD%\julia-tree\usr\bin\julia.exe"
          "%EXE%" -e "println(VERSION)" > eval.out 2> eval.err
          echo === exit %ERRORLEVEL%
          echo === out:
          type eval.out
          echo === err:
          type eval.err

      - name: Enumerate DLL imports of julia.exe and libjulia*.dll
        shell: pwsh
        continue-on-error: true
        run: |
          $dumpbin = (Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $dumpbin) { $dumpbin = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source }
          Write-Host "dumpbin: $dumpbin"
          foreach ($f in @('julia.exe','libjulia.dll','libjulia-internal.dll','libjulia-codegen.dll')) {
            $p = "$PWD\julia-tree\usr\bin\$f"
            if (Test-Path $p) {
              Write-Host "=== /dependents $f ==="
              & $dumpbin /dependents $p
            }
          }

      - name: List DLLs delivered alongside julia.exe
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem "$PWD\julia-tree\usr\bin\*.dll" |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Run the actual sysimage bootstrap command (basecompiler-o.a)
        shell: bash
        continue-on-error: true
        run: |
          set -x
          cd julia-tree
          PRIVATE_LIBDIR="usr/lib/julia"
          mkdir -p "$PRIVATE_LIBDIR"
          # share/julia lives at usr/share/julia in this tree (not at top level),
          # so --dataroot needs to point inside usr/.
          cd base
          "../usr/bin/julia.exe" -O1 \
              -C "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)" \
              --output-o "..\\${PRIVATE_LIBDIR//\//\\}\\basecompiler-o.a.tmp" \
              --startup-file=no --warn-overwrite=yes -g1 Base_compiler.jl \
              --buildroot "..\\usr\\" --dataroot "..\\usr\\share\\" \
              2>&1 | tee ../basecompiler.log
          echo "=== exit code: $? ==="
          echo "=== output tail ==="
          tail -50 ../basecompiler.log

      - name: Upload bootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-log
          path: julia-tree/basecompiler.log
          if-no-files-found: ignore
