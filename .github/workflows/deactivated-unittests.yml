name: deactivated-unittest issues - rerun un-gated tests against 3.8.2

on: [push, workflow_dispatch]

jobs:
  rerun:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: windows-2022
            plat: win_amd64
          - image: macos-15
            plat: macosx_11_0_arm64
          - image: macos-15-intel
            plat: macosx_11_0_x86_64.macosx_11_0_intel
    runs-on: ${{ matrix.image }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: casadi/casadi
          ref: "3.8.2"
          path: src
          sparse-checkout: |
            test/python
            misc
      - uses: ilammy/msvc-dev-cmd@v1
        if: contains(matrix.image, 'windows')
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install casadi 3.8.2 wheel
        shell: bash
        run: |
          python -m pip install -q numpy scipy pandas looseversion
          python -m pip install -q "https://github.com/casadi/casadi/releases/download/3.8.2/casadi-3.8.2-cp311-abi3-${{ matrix.plat }}.whl"
          python -c "import casadi; print(casadi.__version__, casadi.has_conic('superscs'), casadi.has_nlpsol('ipopt'))"
      - name: Apply un-gating patch + fetch serialize_3.5.5 data
        shell: bash
        run: |
          cd src
          git apply ../ungate.patch
          git diff --stat
          cd test/python
          curl -fsSL -o s.zip https://github.com/casadi/testbot/releases/download/perpetual/serialize_3.5.5.zip
          unzip -q s.zip && ls -d serialize_3.5.5
      - name: Run the un-gated tests (unix)
        if: "!contains(matrix.image, 'windows')"
        shell: bash
        run: |
          set +e
          cd src/test/python
          for t in "ad.py ADtests.test_MX" "nlp.py NLPtests.test_infeasible" "function.py Functiontests.test_jit_serialize" "conic.py ConicTests.test_linear" "serialize.py SerializeTests.test_compat" "serialize.py SerializeTests.test_compat" "serialize.py SerializeTests.test_compat"; do
            set -- $t
            python $1 $2 --run_slow > "log_$1_$2.txt" 2>&1; rc=$?
            echo "::group::$t"; tail -n 40 "log_$1_$2.txt"; echo "::endgroup::"
            echo "RESULT rc=$rc : $t" >> summary.txt
          done
          echo "===== SUMMARY ${{ matrix.image }}"; cat summary.txt
      # pwsh like the main CI: in git-bash, coreutils' link.exe shadows MSVC's
      - name: Run the un-gated tests (windows)
        if: contains(matrix.image, 'windows')
        shell: pwsh
        run: |
          cd src/test/python
          $tests = @("ad.py ADtests.test_MX","nlp.py NLPtests.test_infeasible","function.py Functiontests.test_jit_serialize","conic.py ConicTests.test_linear","serialize.py SerializeTests.test_compat","serialize.py SerializeTests.test_compat","serialize.py SerializeTests.test_compat")
          foreach ($t in $tests) {
            $a = $t.Split(" ")
            $log = "log_$($a[0])_$($a[1]).txt"
            python $a[0] $a[1] --run_slow *> $log
            $rc = $LASTEXITCODE
            Write-Output "::group::$t"; Get-Content $log -Tail 40; Write-Output "::endgroup::"
            Add-Content summary.txt "RESULT rc=$rc : $t"
          }
          Write-Output "===== SUMMARY ${{ matrix.image }}"; Get-Content summary.txt
          exit 0
      - name: Measure serialize_3.5.5 mismatch per function
        shell: bash
        run: python measure_compat.py src/test/python/serialize_3.5.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.image }}
          path: src/test/python/log_*.txt
