name: mac 2d linear interpolant nested-AD segfault

# Reproduce the macos-14 test-python-long SIGSEGV in
# function.Functiontests.test_2d_linear_multiout:
#   ca.MX.forward -> Call::ad_forward -> LinearInterpolantJac::get_jacobian
#   -> XFunction::get_jacobian -> veccat/vertcat -> Sparsity::triplet
#   -> Sparsity::assign_cached -> SIGSEGV
# Passes on Linux (benign heap layout); only crashes on macOS arm64.
# Uses the nightly-release-3.8.0 cp311-abi3 macosx_11_0_arm64 wheel.

on: [push, workflow_dispatch]

jobs:
  repro:
    runs-on: macos-14
    steps:
      - name: Baseline
        run: |
          uname -a; sw_vers || true
          python3 --version

      - name: Install casadi nightly wheel (macos arm64)
        run: |
          set -eux
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install -q --upgrade pip numpy
          WHL=casadi-3.8.0-cp311-abi3-macosx_11_0_arm64.whl
          curl -fsSL -o "/tmp/$WHL" \
            "https://github.com/casadi/casadi/releases/download/nightly-release-3.8.0/$WHL"
          pip install -q "/tmp/$WHL"
          python -c "import casadi; print('casadi', casadi.__version__)"

      - name: Minimal escalating repro (isolate the crashing op)
        run: |
          set +e
          . /tmp/venv/bin/activate
          cat > /tmp/repro.py <<'PY'
          import casadi as ca, numpy as np
          np.random.seed(0)
          d_knots=[list(np.linspace(0,1,5)),list(np.linspace(0,1,6))]
          data0=np.random.random([5,6]); data1=np.random.random([5,6])
          stacked=np.vstack((data0.ravel(order='F'),data1.ravel(order='F'))).ravel(order='F')
          LUT=ca.interpolant('name','linear',d_knots,stacked)  # m=2
          x=ca.MX.sym("x"); y=ca.MX.sym("y")
          f=ca.Function('f',[x,y],[LUT(ca.vertcat(x,y))])

          def probe(tag, fn):
              print(f"--- PROBE {tag} ---", flush=True)
              fn()
              print(f"--- PROBE {tag} OK ---", flush=True)

          probe("forward-of-forward", lambda: f.forward(1).forward(1))
          probe("jac-of-jac", lambda: f.jacobian().jacobian())

          def sym_forward_of_jac():
              Jf=f.jacobian()
              ins=[ca.MX.sym("i%d"%i, Jf.sparsity_in(i)) for i in range(Jf.n_in())]
              res=Jf.call(ins)
              fseeds=[ca.MX.sym("s%d"%i, Jf.sparsity_in(i)) for i in range(Jf.n_in())]
              sens=ca.forward(res, ins, [fseeds])[0]   # crash expected here
              vf=ca.Function("vf", ins+fseeds, list(res)+list(sens))
          probe("sym-forward-of-jac", sym_forward_of_jac)

          print("ALL PROBES SURVIVED", flush=True)
          PY
          python /tmp/repro.py
          echo "minimal-repro rc=$?"

      - name: Full test (faithful repro)
        run: |
          set +e
          . /tmp/venv/bin/activate
          git clone --depth 1 --branch release-3.8.0 https://github.com/casadi/casadi.git src
          cd src/test/python
          python function.py Functiontests.test_2d_linear_multiout
          echo "full-test rc=$?"
