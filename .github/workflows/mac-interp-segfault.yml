name: mac 2d linear interpolant nested-AD segfault

# Reproduce the macos-14 test-python-long SIGSEGV in
# function.Functiontests.test_2d_linear_multiout
#   ... LinearInterpolantJac::get_jacobian -> XFunction::get_jacobian
#   -> veccat -> Sparsity::triplet -> Sparsity::assign_cached -> SIGSEGV
# Crash log shows Julia's GC line => libMad/Julia is loaded in-process.
# Isolated repros (no Julia) pass on Linux AND macOS; this harness loads
# libMad first to recreate the real condition. Staged so we learn the
# minimal trigger.

on: [push, workflow_dispatch]

jobs:
  repro:
    runs-on: macos-14
    steps:
      - name: Install casadi nightly wheel (macos arm64)
        run: |
          set -eux
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install -q --upgrade pip numpy
          WHL=casadi-3.8.0-cp311-abi3-macosx_11_0_arm64.whl
          curl -fsSL -o "/tmp/$WHL" \
            "https://github.com/casadi/casadi/releases/download/nightly-release-3.8.0/$WHL"
          pip install -q "/tmp/$WHL"
          python -c "import casadi; print('casadi', casadi.__version__)"

      - name: Fetch + install libMad (apple-aarch64, like commercial_solvers)
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/libMad"
          curl -fL -o "$RUNNER_TEMP/libMad/libMad.tar.gz" \
            "https://github.com/apozharski/libMad/releases/download/v0.0.7-casadi/libMad-apple-aarch64-v0.0.7-casadi.tar.gz"
          tar -xf "$RUNNER_TEMP/libMad/libMad.tar.gz" -C "$RUNNER_TEMP/libMad"
          sudo cp -R "$RUNNER_TEMP/libMad/lib/" /usr/local/lib/ || true
          if [ -d "$RUNNER_TEMP/libMad/share" ]; then sudo cp -R "$RUNNER_TEMP/libMad/share/" /usr/local/share/ || true; fi
          echo "JULIA_CUDA_USE_COMPAT=false" >> $GITHUB_ENV

      - name: A) Full function.py (no Julia) — heap-state-only hypothesis
        run: |
          set +e
          . /tmp/venv/bin/activate
          git clone --depth 1 --branch release-3.8.0 https://github.com/casadi/casadi.git src
          cd src/test/python
          python function.py > /tmp/A.log 2>&1; echo "A) full function.py rc=$?"
          tail -3 /tmp/A.log

      - name: B) Load libMad/Julia (madnlp), THEN interpolant nested-AD
        run: |
          set +e
          . /tmp/venv/bin/activate
          export JULIA_CUDA_USE_COMPAT=false
          cat > /tmp/B.py <<'PY'
          import casadi as ca, numpy as np
          # Force-load libMad/Julia via a madnlp solve
          x=ca.MX.sym("x",2)
          nlp={"x":x,"f":(1-x[0])**2+100*(x[1]-x[0]**2)**2}
          try:
              s=ca.nlpsol("s","madnlp",nlp); print("madnlp solve:", s(x0=[0,0])["x"])
              print("JULIA LOADED", flush=True)
          except Exception as e:
              print("madnlp unavailable:", e, flush=True)
          # Now the crashing nested-AD on the 2D multi-output linear interpolant
          np.random.seed(0)
          d=[list(np.linspace(0,1,5)),list(np.linspace(0,1,6))]
          vals=list(np.random.random(60))
          LUT=ca.interpolant('n','linear',d,vals)
          a=ca.MX.sym("a"); b=ca.MX.sym("b")
          f=ca.Function('f',[a,b],[LUT(ca.vertcat(a,b))])
          for it in range(50):
              J=f.jacobian()
              ins=[ca.MX.sym('i%d'%i,J.sparsity_in(i)) for i in range(J.n_in())]
              res=J.call(ins)
              s=[ca.MX.sym('s%d'%i,J.sparsity_in(i)) for i in range(J.n_in())]
              ca.forward(res,ins,[s])
          print("B) survived nested-AD with Julia loaded", flush=True)
          PY
          DYLD_LIBRARY_PATH=/usr/local/lib python /tmp/B.py; echo "B) rc=$?"

      - name: "C) Faithful alltests.py --run_slow with libMad"
        run: |
          set +e
          . /tmp/venv/bin/activate
          export JULIA_CUDA_USE_COMPAT=false DYLD_LIBRARY_PATH=/usr/local/lib
          cd src/test/python
          python alltests.py --run_slow > /tmp/C.log 2>&1; echo "C) alltests rc=$? (139=SIGSEGV)"
          grep -nE "Segmentation|signal 11|assign_cached|LinearInterpolant|test_2d_linear|Allocations:" /tmp/C.log | tail -25
