name: issue 4172 - sysid.py N=10000 on Apple silicon (3.7.2 vs nightly-main)

on: [push, workflow_dispatch]

jobs:
  sysid:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-14, macos-15]
        casadi: ["3.7.2", "nightly-main"]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          uname -m
          if [ "${{ matrix.casadi }}" = nightly-main ]; then
            python -m pip install -q numpy "https://github.com/casadi/casadi/releases/download/nightly-main/casadi-3.8.1.dev+main-cp311-abi3-macosx_11_0_arm64.whl"
          else
            python -m pip install -q numpy "casadi==${{ matrix.casadi }}"
          fi
          python -c "import casadi; print(casadi.__version__)"
      - name: sysid.py at N=2000, 2500, 10000
        shell: bash
        run: |
          set +e
          fail=0
          for N in 2000 2500 10000; do
            python issue4172/sysid.py $N > out_$N.txt 2>&1
            rc=$?
            tail -5 out_$N.txt
            echo "RESULT casadi=${{ matrix.casadi }} image=${{ matrix.image }} N=$N rc=$rc"
            [ $rc -ne 0 ] && fail=1
          done
          exit $fail
