name: shell compiler argument quoting / Visual Studio auto-setup tests

on:
  push:
    branches: [shell-compiler-args]
  workflow_dispatch:

concurrency:
  group: shell-compiler-args-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: msvc (${{ matrix.os }}, ${{ matrix.arch }}, thread=${{ matrix.thread }}${{ matrix.candidate && ', candidate' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, arch: x64, thread: "ON"}
          - {os: windows-11-arm, arch: ARM64, thread: "ON"}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Source checksums
        run: Get-FileHash src/* | Format-Table -AutoSize
      - name: Build
        run: |
          cmake -B build -A ${{ matrix.arch }} -DWITH_THREAD=${{ matrix.thread }}
          cmake --build build --config Release
      - name: argv_dump with gcc
        if: matrix.arch == 'x64'
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) { gcc -O1 -o build/argv_dump_gcc.exe tests/argv_dump.c -lshell32 }
          exit 0
      - name: Prepare
        run: |
          $w = "$env:RUNNER_TEMP\work dir (1)"
          $d = "--dump", "msvc=$PWD\build\Release\argv_dump.exe"
          if (Test-Path build/argv_dump_gcc.exe) { $d += "--dump", "mingw=$PWD\build\argv_dump_gcc.exe" }
          "HARNESS_WORK=$w" | Out-File -Append $env:GITHUB_ENV
          "HARNESS_DUMPS=$($d -join '|')" | Out-File -Append $env:GITHUB_ENV
      - name: Threads, first Visual Studio setup (cl)
        if: always()
        run: build/Release/harness.exe --work "$env:HARNESS_WORK\t" @($env:HARNESS_DUMPS -split '\|') --jit cl --only threads
      - name: All tests (cl)
        if: always()
        run: build/Release/harness.exe --work "$env:HARNESS_WORK\a" @($env:HARNESS_DUMPS -split '\|') --jit cl
      - name: JIT tests (gcc)
        if: always() && matrix.arch == 'x64'
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { "no gcc"; exit 0 }
          build/Release/harness.exe --work "$env:HARNESS_WORK\g" @($env:HARNESS_DUMPS -split '\|') --jit gcc --only jit --only wrap
      - name: JIT tests with DelayedExpansion enabled (cl)
        if: always() && matrix.thread == 'ON'
        run: |
          reg add "HKCU\Software\Microsoft\Command Processor" /v DelayedExpansion /t REG_DWORD /d 1 /f
          cmd /c "set X=1 & echo !X!"
          build/Release/harness.exe --work "$env:HARNESS_WORK\d" @($env:HARNESS_DUMPS -split '\|') --jit cl --only jit --only quote --only vs
          $r = $LASTEXITCODE
          reg delete "HKCU\Software\Microsoft\Command Processor" /v DelayedExpansion /f
          exit $r
      - name: Process code page variants (cl)
        if: always() && matrix.arch == 'x64'
        run: |
          foreach ($v in "utf8", "acp932") {
            "=== $v"
            & "build/Release/harness_$v.exe" --work "$env:HARNESS_WORK\cp $v" @($env:HARNESS_DUMPS -split '\|') --jit cl --only units --only quote --only jit
          }
          exit 0
      - name: JIT tests from git-bash (cl)
        if: always()
        shell: bash
        run: ./build/Release/harness.exe --work "$RUNNER_TEMP/work dir (1)/b" --dump "msvc=$PWD/build/Release/argv_dump.exe" --jit cl --only jit --only vs

  msvc-devprompt:
    name: msvc with cl.exe on PATH
    if: ${{ !contains(github.event.head_commit.message, '[cp-only]') }}
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Build
        run: |
          where.exe cl.exe
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Tests (cl)
        run: build/harness.exe --work "$env:RUNNER_TEMP\work dir" --dump "msvc=$PWD\build\argv_dump.exe" --jit cl --only jit --only vs --only quote --only wrap

  mingw-native:
    name: mingw (windows-2022, runner gcc)
    if: ${{ !contains(github.event.head_commit.message, '[cp-only]') }}
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Build
        run: |
          gcc --version
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DWITH_THREAD=ON
          cmake --build build
      - name: Prepare
        run: '"HARNESS_WORK=$env:RUNNER_TEMP\work dir (1)" | Out-File -Append $env:GITHUB_ENV'
      - name: Threads, first Visual Studio setup (cl)
        if: always()
        run: build/harness.exe --work "$env:HARNESS_WORK\t" --dump "mingw=$PWD\build\argv_dump.exe" --jit cl --only threads
      - name: All tests (cl)
        if: always()
        run: build/harness.exe --work "$env:HARNESS_WORK\a" --dump "mingw=$PWD\build\argv_dump.exe" --jit cl
      - name: JIT tests (gcc)
        if: always()
        run: build/harness.exe --work "$env:HARNESS_WORK\g" --dump "mingw=$PWD\build\argv_dump.exe" --jit gcc --only jit --only threads --only wrap

  mingw-cross-build:
    name: mingw cross build (dockcross windows-shared-x64-posix)
    if: ${{ !contains(github.event.head_commit.message, '[cp-only]') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        thread: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Setup dockcross
        run: |
          docker run --rm ghcr.io/jgillis/windows-shared-x64-posix:production > dockcross
          chmod +x dockcross
      - name: Build
        run: |
          ./dockcross cmake -Bbuild -H. -DCMAKE_BUILD_TYPE=Release -DWITH_THREAD=${{ matrix.thread }}
          ./dockcross cmake --build build -v
          for f in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            ./dockcross bash -c "p=\$(find /usr/src/mxe/usr -name $f 2>/dev/null | head -n 1); echo \$p; [ -n \"\$p\" ] && cp \$p build/" || true
          done
          mkdir out
          cp build/*.exe build/*.dll out/ || true
          ls -la out
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: mingw-cross-${{ matrix.thread }}
          path: out

  mingw-cross-run:
    name: mingw cross run (windows-2022, thread=${{ matrix.thread }})
    needs: mingw-cross-build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        thread: ["ON", "OFF"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          name: mingw-cross-${{ matrix.thread }}
          path: bin
      - name: Prepare
        run: '"HARNESS_WORK=$env:RUNNER_TEMP\work dir (1)" | Out-File -Append $env:GITHUB_ENV'
      - name: Threads, first Visual Studio setup (cl)
        if: always()
        run: bin/harness.exe --work "$env:HARNESS_WORK\t" --dump "mingw=$PWD\bin\argv_dump.exe" --jit cl --only threads
      - name: All tests (cl)
        if: always()
        run: bin/harness.exe --work "$env:HARNESS_WORK\a" --dump "mingw=$PWD\bin\argv_dump.exe" --jit cl
      - name: JIT tests (gcc)
        if: always()
        run: bin/harness.exe --work "$env:HARNESS_WORK\g" --dump "mingw=$PWD\bin\argv_dump.exe" --jit gcc --only jit --only wrap

  posix:
    name: posix (${{ matrix.os }})
    if: ${{ !contains(github.event.head_commit.message, '[cp-only]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Threads (cc)
        if: always()
        run: ./build/harness --work "$RUNNER_TEMP/work dir (1)/t" --dump "cc=$PWD/build/argv_dump" --jit cc --only threads
      - name: All tests (cc)
        if: always()
        run: ./build/harness --work "$RUNNER_TEMP/work dir (1)/a" --dump "cc=$PWD/build/argv_dump" --jit cc
