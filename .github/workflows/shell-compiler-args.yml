name: shell compiler argument quoting / Visual Studio auto-setup tests

on:
  push:
    branches: [shell-compiler-args]
  workflow_dispatch:

concurrency:
  group: shell-compiler-args-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: msvc (${{ matrix.os }}, ${{ matrix.arch }}, thread=${{ matrix.thread }}${{ matrix.candidate && ', candidate' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, arch: x64, thread: "ON"}
          - {os: windows-2022, arch: x64, thread: "OFF"}
          - {os: windows-2022, arch: Win32, thread: "ON"}
          - {os: windows-2025, arch: x64, thread: "ON"}
          - {os: windows-11-arm, arch: ARM64, thread: "ON"}
          - {os: windows-2022, arch: x64, thread: "ON", candidate: "ON"}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Source checksums
        run: Get-FileHash src/* | Format-Table -AutoSize
      - name: Environment
        run: |
          where.exe cl.exe; where.exe link.exe; where.exe gcc; "ComSpec=$env:ComSpec"
          "ACP:"; (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage).ACP
          exit 0
      - name: Build
        run: |
          cmake -B build -A ${{ matrix.arch }} -DWITH_THREAD=${{ matrix.thread }} -DCANDIDATE=${{ matrix.candidate || 'OFF' }}
          cmake --build build --config Release
      - name: argv_dump with gcc
        if: matrix.arch == 'x64'
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) { gcc -O1 -o build/argv_dump_gcc.exe tests/argv_dump.c -lshell32; gcc --version }
          exit 0
      - name: Prepare
        run: |
          $w = "$env:RUNNER_TEMP\work dir (1)"
          New-Item -ItemType Directory -Force $w | Out-Null
          $d = "--dump", "msvc=$PWD\build\Release\argv_dump.exe"
          if (Test-Path build/argv_dump_gcc.exe) { $d += "--dump", "mingw=$PWD\build\argv_dump_gcc.exe" }
          "HARNESS_WORK=$w" | Out-File -Append $env:GITHUB_ENV
          "HARNESS_DUMPS=$($d -join '|')" | Out-File -Append $env:GITHUB_ENV
      - name: vcvarsall exit status for an invalid architecture
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $bat = "$vs\VC\Auxiliary\Build\vcvarsall.bat"
          cmd /d /c "call `"$bat`" bogus_arch >nul & echo errorlevel=%errorlevel%"
          cmd /d /c "`"$bat`" bogus_arch >nul && echo and-branch || echo or-branch"
          exit 0
      - name: Threads, first Visual Studio setup (cl)
        if: always()
        run: |
          build/Release/harness.exe --work "$env:HARNESS_WORK\t" @($env:HARNESS_DUMPS -split '\|') --jit cl --only threads
      - name: All tests (cl)
        if: always()
        run: |
          build/Release/harness.exe --work "$env:HARNESS_WORK\a" @($env:HARNESS_DUMPS -split '\|') --jit cl
      - name: JIT tests (gcc)
        if: always() && matrix.arch == 'x64'
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { "no gcc"; exit 0 }
          build/Release/harness.exe --work "$env:HARNESS_WORK\g" @($env:HARNESS_DUMPS -split '\|') --jit gcc --only jit
      - name: JIT and Visual Studio tests from git-bash (cl)
        if: always()
        shell: bash
        run: |
          which link || true
          ./build/Release/harness.exe --work "$RUNNER_TEMP/work dir (1)/b" --dump "msvc=$PWD/build/Release/argv_dump.exe" --jit cl --only jit --only vs

  msvc-devprompt:
    name: msvc with cl.exe on PATH
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Build
        run: |
          where.exe cl.exe
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Tests (cl)
        run: |
          build/harness.exe --work "$env:RUNNER_TEMP\work dir" --dump "msvc=$PWD\build\argv_dump.exe" --jit cl --only jit --only vs --only quote --only winrun

  mingw-native:
    name: mingw (${{ matrix.os }}, runner gcc)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Build
        run: |
          gcc --version; where.exe gcc
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DWITH_THREAD=ON
          cmake --build build
      - name: Prepare
        run: |
          $w = "$env:RUNNER_TEMP\work dir (1)"
          "HARNESS_WORK=$w" | Out-File -Append $env:GITHUB_ENV
      - name: Threads, first Visual Studio setup (cl)
        if: always()
        run: build/harness.exe --work "$env:HARNESS_WORK\t" --dump "mingw=$PWD\build\argv_dump.exe" --jit cl --only threads
      - name: All tests (cl)
        if: always()
        run: build/harness.exe --work "$env:HARNESS_WORK\a" --dump "mingw=$PWD\build\argv_dump.exe" --jit cl
      - name: JIT tests (gcc)
        if: always()
        run: build/harness.exe --work "$env:HARNESS_WORK\g" --dump "mingw=$PWD\build\argv_dump.exe" --jit gcc --only jit --only threads

  mingw-cross-build:
    name: mingw cross build (dockcross windows-shared-x64-posix)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        thread: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Setup dockcross
        run: |
          docker run --rm ghcr.io/jgillis/windows-shared-x64-posix:production > dockcross
          chmod +x dockcross
      - name: Build
        run: |
          ./dockcross cmake -Bbuild -H. -DCMAKE_BUILD_TYPE=Release -DWITH_THREAD=${{ matrix.thread }}
          ./dockcross cmake --build build -v
          ./dockcross bash -c 'echo $CC; $CC --version; ${CROSS_TRIPLE}-objdump -p build/harness.exe | grep "DLL Name"' || true
          for f in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            ./dockcross bash -c "p=\$(find /usr/src/mxe/usr /usr/lib/gcc /usr/x86_64-w64-mingw32* -name $f 2>/dev/null | head -n 1); echo \$p; [ -n \"\$p\" ] && cp \$p build/" || true
          done
          mkdir out
          cp build/*.exe build/*.dll out/ || true
          ls -la out
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: mingw-cross-${{ matrix.thread }}
          path: out

  mingw-cross-run:
    name: mingw cross run (${{ matrix.os }}, thread=${{ matrix.thread }})
    needs: mingw-cross-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        thread: ["ON", "OFF"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          name: mingw-cross-${{ matrix.thread }}
          path: bin
      - name: Prepare
        run: |
          Get-ChildItem bin
          $w = "$env:RUNNER_TEMP\work dir (1)"
          "HARNESS_WORK=$w" | Out-File -Append $env:GITHUB_ENV
      - name: Threads, first Visual Studio setup (cl)
        if: always()
        run: bin/harness.exe --work "$env:HARNESS_WORK\t" --dump "mingw=$PWD\bin\argv_dump.exe" --jit cl --only threads
      - name: All tests (cl)
        if: always()
        run: bin/harness.exe --work "$env:HARNESS_WORK\a" --dump "mingw=$PWD\bin\argv_dump.exe" --jit cl
      - name: JIT tests (gcc)
        if: always()
        run: bin/harness.exe --work "$env:HARNESS_WORK\g" --dump "mingw=$PWD\bin\argv_dump.exe" --jit gcc --only jit

  posix:
    name: posix (${{ matrix.os }}, candidate=${{ matrix.candidate }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        candidate: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCANDIDATE=${{ matrix.candidate }}
          cmake --build build
      - name: Threads (cc)
        if: always()
        run: ./build/harness --work "$RUNNER_TEMP/work dir (1)/t" --dump "cc=$PWD/build/argv_dump" --jit cc --only threads
      - name: All tests (cc)
        if: always()
        run: ./build/harness --work "$RUNNER_TEMP/work dir (1)/a" --dump "cc=$PWD/build/argv_dump" --jit cc
      - name: Environment under RTLD_DEEPBIND
        if: always() && runner.os == 'Linux'
        run: ./build/deepbind_main "$PWD/build/libshell_env.so" "$PWD/build/argv_dump" "$RUNNER_TEMP/db.txt"
