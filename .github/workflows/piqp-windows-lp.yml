name: PIQP LP failure on Windows (fresh f38ca70abf)

on: [push, workflow_dispatch]

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.1.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download fresh PIQP-enabled win64 build
        shell: bash
        run: |
          curl -sSL https://github.com/casadi/debug/releases/download/piqp-win-fresh/casadi-windows64-py311.zip -o casadi.zip
          mkdir -p cs && unzip -q casadi.zip -d cs
          ls cs/casadi/libcasadi_conic_piqp.dll

      - name: Install numpy
        shell: bash
        run: python -m pip install --upgrade pip numpy

      - name: Reproduce test_linear (LP) with PIQP, both backends
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/cs
        run: |
          python - <<'PY'
          import casadi as ca
          from casadi import inf, DM
          print("casadi", ca.__version__, "has piqp", ca.has_conic("piqp"))

          # exact test_linear data (pure LP: empty Hessian)
          H = DM(2,2)
          A = DM([[-1,1],[1,1],[1,-2]])
          LBA = DM([-inf,2,-inf]); UBA = DM([1,inf,4])
          LBX = DM([-inf,0]);      UBX = DM([inf,inf])
          G   = DM([2,1])
          ins = dict(h=H,g=G,a=A,lbx=LBX,ubx=UBX,lba=LBA,uba=UBA)
          expect_x = DM([0.5,1.5]); expect_cost = 2.5

          def run(tag, opts):
              print("="*60); print(tag, opts)
              try:
                  s = ca.conic("s","piqp",{'h':H.sparsity(),'a':A.sparsity()},
                               {**opts, "error_on_fail": False})
                  r = s(**ins)
                  st = s.stats()
                  print("  return_status:", st.get("return_status"))
                  print("  success      :", st.get("success"))
                  print("  x   :", r['x'].T, " expect", expect_x.T)
                  print("  cost:", float(r['cost']), " expect", expect_cost)
              except Exception as e:
                  print("  EXCEPTION:", repr(e))

          run("LP sparse_ldlt",   {"piqp":{"kkt_solver":"sparse_ldlt","verbose":True}})
          run("LP dense_cholesky",{"piqp":{"kkt_solver":"dense_cholesky","verbose":True}})
          run("LP sparse default",{"piqp":{}})

          # QP control: does PIQP solve a QP on Windows?
          Hq = DM([[2,0],[0,2]])
          sq = ca.conic("sq","piqp",{'h':Hq.sparsity(),'a':A.sparsity()},
                        {"piqp":{"verbose":False},"error_on_fail":False})
          rq = sq(h=Hq,g=G,a=A,lbx=LBX,ubx=UBX,lba=LBA,uba=UBA)
          print("="*60); print("QP control return_status:", sq.stats().get("return_status"),
                "x=", rq['x'].T)
          PY
