name: PIQP LP failure on Windows (fresh f38ca70abf)

on: [push, workflow_dispatch]

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.1.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download fresh PIQP-enabled win64 build
        shell: bash
        run: |
          curl -sSL https://github.com/casadi/debug/releases/download/piqp-win-fresh/casadi-windows64-py311.zip -o casadi.zip
          mkdir -p cs && unzip -q casadi.zip -d cs
          ls cs/casadi/libcasadi_conic_piqp.dll

      - name: Install numpy
        shell: bash
        run: python -m pip install --upgrade pip numpy

      - name: Reproduce test_linear (LP) with PIQP, both backends
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/cs
        run: |
          python - <<'PY'
          import casadi as ca
          from casadi import inf, DM
          print("casadi", ca.__version__, "has piqp", ca.has_conic("piqp"))

          # exact test_linear data (pure LP: empty Hessian)
          H = DM(2,2)
          A = DM([[-1,1],[1,1],[1,-2]])
          LBA = DM([-inf,2,-inf]); UBA = DM([1,inf,4])
          LBX = DM([-inf,0]);      UBX = DM([inf,inf])
          G   = DM([2,1])
          ins = dict(h=H,g=G,a=A,lbx=LBX,ubx=UBX,lba=LBA,uba=UBA)
          expect_x = DM([0.5,1.5]); expect_cost = 2.5

          def run(tag, opts):
              print("="*60); print(tag, opts)
              try:
                  s = ca.conic("s","piqp",{'h':H.sparsity(),'a':A.sparsity()},
                               {**opts, "error_on_fail": False})
                  r = s(**ins)
                  st = s.stats()
                  print("  return_status:", st.get("return_status"))
                  print("  success      :", st.get("success"))
                  print("  x   :", r['x'].T, " expect", expect_x.T)
                  print("  cost:", float(r['cost']), " expect", expect_cost)
              except Exception as e:
                  print("  EXCEPTION:", repr(e))

          run("LP test_linear sparse",   {"piqp":{"kkt_solver":"sparse_ldlt"}})

          # --- test_linear2: FIXED variable (lbx[1]==ubx[1]==3), direct solve ---
          LBX2 = DM([-inf,3]); UBX2 = DM([inf,3])
          ins2 = dict(h=H,g=G,a=A,lbx=LBX2,ubx=UBX2,lba=LBA,uba=UBA)
          for be in ("sparse_ldlt","dense_cholesky"):
              print("="*60); print("test_linear2 (fixed var x1=3)", be)
              s = ca.conic("s2","piqp",{'h':H.sparsity(),'a':A.sparsity()},
                           {"piqp":{"kkt_solver":be,"verbose":True},"error_on_fail":False})
              r = s(**ins2)
              print("  return_status:", s.stats().get("return_status"),
                    "x=", r['x'].T, "expect [2,3] cost", float(r['cost']), "expect 7")

          # --- test_linear via serialize round-trip (what check_serialize does) ---
          print("="*60); print("test_linear via serialize round-trip")
          s = ca.conic("s","piqp",{'h':H.sparsity(),'a':A.sparsity()},
                       {"piqp":{"kkt_solver":"sparse_ldlt"},"error_on_fail":False})
          try:
              s2 = ca.Function.deserialize(s.serialize({"debug":True}))
              r2 = s2(**ins)
              print("  deserialized return_status:", s2.stats().get("return_status"),
                    "x=", r2['x'].T, "expect [0.5,1.5]")
          except Exception as e:
              print("  SERIALIZE EXCEPTION:", repr(e))
          PY
